// --- Mobile menu toggle (matches live site: epcl-menu-open on <html>) ---
(function() {
  var toggle = document.getElementById('menu-toggle');
  var overlay = document.getElementById('menu-overlay');
  var mobileNav = document.getElementById('mobile-nav');
  function openMenu() { document.documentElement.classList.add('epcl-menu-open'); }
  function closeMenu() { document.documentElement.classList.remove('epcl-menu-open'); }
  function isOpen() { return document.documentElement.classList.contains('epcl-menu-open'); }
  if (toggle) {
    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isOpen()) closeMenu(); else openMenu();
    });
  }
  if (overlay) overlay.addEventListener('click', closeMenu);
  if (mobileNav) {
    mobileNav.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', closeMenu);
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeMenu();
  });
})();
</script>

<script>
(function(){
  // Mobile: land on the game (skip the tall site header) so the in-page ad sits just below it.
  if (!window.matchMedia || !window.matchMedia('(max-width: 991px)').matches) return;
  var target = document.getElementById('play') || document.querySelector('.game-frame-wrap');
  if (!target) return;
  if ('scrollRestoration' in history) { try { history.scrollRestoration = 'manual'; } catch(e){} }
  // don't let the browser pin the old top-of-page content while the header settles
  try { document.documentElement.style.overflowAnchor = 'none'; } catch(e){}

  // A real user gesture cancels auto-landing so we never fight their scroll.
  var locked = false;
  ['touchstart','wheel','keydown','pointerdown'].forEach(function(ev){
    window.addEventListener(ev, function(){ locked = true; }, { passive: true, once: true });
  });

  function land(){
    if (locked) return;
    var y = target.getBoundingClientRect().top + window.pageYOffset - 6;
    if (y < 0) y = 0;
    window.scrollTo(0, y);
  }

  // Re-apply as the header logo image, web fonts and lazy iframe settle — each of
  // these changes the header height and would otherwise leave us short (on the "All games" link).
  land();
  window.addEventListener('load', land);
  window.addEventListener('pageshow', land);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(land); }
  var logo = document.querySelector('.site-header .logo img');
  if (logo && !logo.complete) { logo.addEventListener('load', land); }
  [80, 200, 400, 700, 1100].forEach(function(ms){ setTimeout(land, ms); });
})();
</script>
